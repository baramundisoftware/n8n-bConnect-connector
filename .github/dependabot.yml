version: 2
updates:
  - package-ecosystem: "github-actions"
    # .github/workflows/*.yml; only GitHub-owned actions are allowed in this org.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Group updates so a routine week produces a couple of green-and-mergeable
    # PRs instead of one per dependency. Groups are restricted to minor/patch;
    # breaking majors arrive separately and only for deps not ignored below.
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # Breaking majors handled as deliberate migration tasks, not auto-PRs.
      # (These are exactly the bumps that broke the build/tests: see the
      #  declined PRs #10 typescript, #11 eslint, #14 vitest.)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint is peer-pinned to an EXACT version by @n8n/node-cli
      # (0.34 pins eslint 9.29.0), so any eslint bump breaks `npm ci`.
      # It is governed by node-cli — ignore all updates; it moves only when
      # node-cli is upgraded as a deliberate task.
      - dependency-name: "eslint"
      - dependency-name: "typescript-eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      # @n8n/node-cli is the build toolchain — upgrade it as a deliberate,
      # locally-verified task. It is a 0.x package, so its meaningful bumps are
      # semver-minor; ignore both minor and major so Dependabot never auto-PRs it.
      - dependency-name: "@n8n/node-cli"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "npm"
