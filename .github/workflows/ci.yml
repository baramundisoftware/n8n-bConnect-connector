name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  id-token: write    # Required for npm provenance (Sigstore OIDC)

jobs:
  dependency-review:
    name: Dependency Review (SCA)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019  # v4.5.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0
          comment-summary-in-pr: always

  build-and-test:
    name: Build, Lint, Test, Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (zero errors required)
        run: npm run lint

      - name: TypeScript build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Security audit (runtime dependencies only)
        # Accepted known findings (no fix available upstream):
        #   GHSA-r5fr-rjxr-66jc — lodash code injection via _.template (in n8n-workflow, not called by this connector)
        #   GHSA-f23m-r3pf-42rh — lodash prototype pollution via _.unset/_.omit (in n8n-workflow, not called by this connector)
        # Level set to critical so CI blocks only on critical severity.
        # Re-evaluate when n8n-workflow ships a lodash patch.
        run: npm audit --omit=dev --audit-level=critical

      - name: License compliance check
        run: |
          npx license-checker --production --failOn "GPL-3.0-only;GPL-3.0-or-later;AGPL-3.0-only;AGPL-3.0-or-later;SSPL-1.0" --summary
          echo "License compliance OK — no denied licenses found"

      - name: File permission check (no 664 or executable .ts files)
        run: |
          bad=$(find nodes test -name "*.ts" ! -perm 644 2>/dev/null)
          if [ -n "$bad" ]; then
            echo "ERROR: The following .ts files have unexpected permissions:"
            echo "$bad" | xargs ls -la
            exit 1
          fi
          echo "All .ts file permissions OK (644)"
