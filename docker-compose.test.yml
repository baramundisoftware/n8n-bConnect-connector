services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-baramundi-test
    ports:
      - "5678:5678"
    environment:
      - N8N_CUSTOM_EXTENSIONS=/home/node/custom
      # Disable telemetry / version checks during testing
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      # Allow community nodes (required for custom node loading)
      - N8N_COMMUNITY_PACKAGES_ALLOW_TOOL_USAGE=true
    volumes:
      - n8n_test_data:/home/node/.n8n
      - ./n8n-nodes-baramundi-0.4.1.tgz:/tmp/package.tgz:ro
    entrypoint: >
      sh -c "
        mkdir -p /home/node/custom &&
        cd /home/node/custom &&
        npm install /tmp/package.tgz --prefer-offline 2>&1 &&
        echo '✅ Baramundi node installed' &&
        n8n start
      "

volumes:
  n8n_test_data:
